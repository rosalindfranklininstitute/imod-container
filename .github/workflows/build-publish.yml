name: Build IMOD container images and publish to Quay.io

on:
  workflow_dispatch:
    inputs:
      imod_version:
        description: IMOD release (e.g. 5.1.13) - to match imod_url
        type: string
        required: true
      cuda_version:
        description: CUDA version (e.g. 12.0) - to match imod_url
        type: string
        required: true
      imod_url: 
        description: URL of RHEL AMD64 IMOD installer from IMOD download page
        type: string
        required: true
      virtualgl_version:
        description: VirtualGL release for -vgl tag (e.g. 3.1.5)
        type: string
        default: '3.1.5'
      latest:
        description: Set latest and latest-vgl tags
        type: boolean
        default: false
env:
  IMAGE: quay.io/rosalindfranklininstitute/imod-container

jobs:
  build-container:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Get build timestamp
        id: time
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Log in to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - uses: docker/setup-buildx-action@v4

      - uses: sigstore/cosign-installer@v4.1.0

      - name: Build and push IMOD image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.imod_version }}-cuda${{ inputs.cuda_version }}
            ${{ inputs.latest && format('{0}:latest', env.IMAGE) || '' }}
          build-args: |
            IMOD_VERSION=${{ inputs.imod_version }}
            CUDA_VERSION=${{ inputs.cuda_version }}
            IMOD_URL=${{ inputs.imod_url }}
            IMAGE_VERSION=${{ inputs.imod_version }}-cuda${{ inputs.cuda_version }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_CREATED=${{ steps.time.outputs.created }}

      - name: Build and push IMOD+VirtualGL image
        id: build-vgl
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile-vgl
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.imod_version }}-cuda${{ inputs.cuda_version }}-vgl
            ${{ inputs.latest && format('{0}:latest-vgl', env.IMAGE) || '' }}
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
            VIRTUALGL_VERSION=${{ inputs.virtualgl_version }}
            IMAGE_VERSION=${{ inputs.imod_version }}-cuda${{ inputs.cuda_version }}-vgl
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_CREATED=${{ steps.time.outputs.created }}

      - name: Sign images
        env:
          DIGEST_IMOD: ${{ steps.build.outputs.digest }}
          DIGEST_VGL: ${{ steps.build-vgl.outputs.digest }}
        run: |
          cosign sign --yes "${{ env.IMAGE }}@${DIGEST_IMOD}"
          cosign sign --yes "${{ env.IMAGE }}@${DIGEST_VGL}"

      - name: Verify signatures
        env:
          DIGEST_IMOD: ${{ steps.build.outputs.digest }}
          DIGEST_VGL: ${{ steps.build-vgl.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/build-publish.yml@${{ github.ref }}
        run: |
          for d in "${DIGEST_IMOD}" "${DIGEST_VGL}"; do
            cosign verify "${{ env.IMAGE }}@${d}" \
              --certificate-identity "${IDENTITY}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
