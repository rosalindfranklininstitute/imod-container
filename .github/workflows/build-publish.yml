name: Build IMOD container images and publish to Quay.io

on:
  workflow_dispatch:
    inputs:
      imod_version:
        description: IMOD release (e.g. 5.1.13)
        type: string
        required: true
      cuda_version:
        description: CUDA version (e.g. 12.0)
        type: string
        required: true
      rhel_version:
        description: RHEL version string (e.g. 8-64)
        type: string
        required: true
      imod_url:
        description: Optional full installer URL, overrides the one built from the versions
        type: string
        required: false
      latest:
        description: Also set the latest tag
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Get build timestamp
        id: time
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Log in to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push IMOD image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: true
          tags: |
            quay.io/rosalindfranklininstitute/imod-container:${{ inputs.imod_version }}-cuda${{ inputs.cuda_version }}
            ${{ inputs.latest && 'quay.io/rosalindfranklininstitute/imod-container:latest' || '' }}
          build-args: |
            IMOD_VERSION=${{ inputs.imod_version }}
            CUDA_VERSION=${{ inputs.cuda_version }}
            RHEL_VERSION=${{ inputs.rhel_version }}
            ${{ inputs.imod_url && format('IMOD_URL={0}', inputs.imod_url) || '' }}
            IMAGE_VERSION=${{ inputs.imod_version }}-cuda${{ inputs.cuda_version }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_CREATED=${{ steps.time.outputs.created }}
